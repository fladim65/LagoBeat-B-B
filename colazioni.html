<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colazione Gourmet - LagoBeat B&B</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html" style="text-decoration:none; color:white; font-weight:bold;">LAGOBEAT B&B</a>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="servizi.html">Servizi</a></li>
                <li><a href="contatti.html">Contatti</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <section class="card">
            <img src="images/sala-colazione.jpg" alt="Sala Colazione" class="main-img" style="width:100%; border-radius:15px; margin-bottom: 20px;">

            <h1>Il Risveglio Gourmet</h1>
            <p>Prodotti locali a KM 0, torte artigianali e una vista mozzafiato sul Garda.</p>

            <div class="room-gallery" style="margin-top: 30px;">
                <div class="gallery-item">
                    <img src="images/colazione-dettaglio1.jpg" alt="Dettaglio 1">
                    <p><b>BUFFET FRESCO</b></p>
                </div>
                <div class="gallery-item">
                    <img src="images/colazione-dettaglio2.jpg" alt="Dettaglio 2">
                    <p><b>VISTA LAGO</b></p>
                </div>
            </div>
        </section>
    </main>

    <footer style="text-align: center; padding: 30px 0; color: #777;">
        <p>&copy; 2026 LagoBeat B&B - Malcesine</p>
    </footer>

    <div id="chatbot-container" style="position: fixed; bottom: 20px; right: 20px; z-index: 1000; font-family: sans-serif;">
        <div id="chat-window" style="width: 300px; background: white; border-radius: 15px; box-shadow: 0 5px 25px rgba(0,0,0,0.2); display: none; flex-direction: column; overflow: hidden; border: 1px solid #ddd;">
            <div style="background: #2c3e50; color: white; padding: 15px; font-weight: bold; display: flex; justify-content: space-between;">
                <span>LagoBeat Assistant</span>
                <span style="cursor:pointer" onclick="toggleChat()">✖</span>
            </div>
            <div id="chat-body" style="padding: 15px; max-height: 350px; overflow-y: auto;">
                <div id="chat-msg-box" style="margin-bottom: 15px; padding: 10px; border-radius: 10px; background: #f1f1f1; font-size: 0.9rem;">Buongiorno! Hai domande sulla nostra colazione?</div>
                <div id="chat-options" style="display: flex; flex-direction: column; gap: 8px;"></div>
            </div>
        </div>
        <div id="chat-bubble" onclick="toggleChat()" style="width: 60px; height: 60px; background: #e67e22; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
            <img src="https://cdn-icons-png.flaticon.com/512/4712/4712035.png" alt="Chat" style="width: 35px;">
        </div>
    </div>

    <script>
        const msgBox = document.getElementById('chat-msg-box');
        const options = document.getElementById('chat-options');
        const chatWin = document.getElementById('chat-window');
        function toggleChat() { chatWin.style.display = chatWin.style.display === 'flex' ? 'none' : 'flex'; showMainMenu(); }
        function showMainMenu() {
            msgBox.innerHTML = "Cosa desideri sapere?";
            options.innerHTML = `
                <button class="chat-btn-style" onclick="showOrari()">⏰ Orari Colazione</button>
                <button class="chat-btn-style" onclick="showPrezzi()">💰 Prezzi Camere</button>
                <button class="chat-btn-style" onclick="location.href='https://wa.me/393282124247'">💬 WhatsApp</button>
                <button class="chat-btn-style" onclick="location.href='camere.html'">🛌 Vedi le Suite</button>`;
        }
        function showOrari() { msgBox.innerHTML = "La colazione è servita dalle 8:00 alle 10:30 nella sala panoramica."; options.innerHTML = `<button class="chat-btn-style" onclick="showMainMenu()">⬅️ Indietro</button>`; }
        function showPrezzi() { msgBox.innerHTML = "Le suite partono da €150/notte, colazione sempre inclusa!"; options.innerHTML = `<button class="chat-btn-style" onclick="showMainMenu()">⬅️ Indietro</button>`; }
    </script>
    <style>
        .chat-btn-style { background: white; border: 1px solid #e67e22; color: #2c3e50; padding: 10px; border-radius: 8px; cursor: pointer; text-align: left; transition: 0.2s; font-size: 0.9rem;}
        .chat-btn-style:hover { background: #e67e22; color: white; }
    </style>
</body>
</html>
