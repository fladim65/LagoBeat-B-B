<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Suite 3 - LagoBeat B&B</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header><nav><a href="index.html">LAGOBEAT B&B</a><ul><li><a href="camere.html">Indietro</a></li></ul></nav></header>
    <main class="container" style="padding:20px;">
        <div class="card" style="max-width:800px; margin:auto; padding:20px;">
            <h1>Suite Deluxe 1</h1>
            <img src="images/camera1.jpg" style="width:100%; border-radius:15px; margin-bottom:20px;">
            <p>Dotata di <b>TV Satellitare</b> e <b>Minibar</b>. Prezzo: €220/notte.</p>
            <a href="https://wa.me/393282124247" class="btn" style="background:#25d366; color:white; padding:15px; text-decoration:none; display:inline-block; border-radius:10px;">Prenota su WhatsApp</a>
        </div>
    </main>
    <div id="chatbot-container" style="position: fixed; bottom: 20px; right: 20px; z-index: 1000; font-family: sans-serif;">
    <div id="chat-window" style="width: 320px; background: white; border-radius: 15px; box-shadow: 0 5px 25px rgba(0,0,0,0.2); display: none; flex-direction: column; overflow: hidden; border: 1px solid #ddd;">
        <div style="background: #2c3e50; color: white; padding: 15px; font-weight: bold; display: flex; justify-content: space-between;">
            <span>LagoBeat Assistant</span>
            <span style="cursor:pointer" onclick="toggleChat()">✖</span>
        </div>
        <div id="chat-body" style="padding: 15px; max-height: 400px; overflow-y: auto;">
            <div id="chat-msg-box" style="margin-bottom: 15px; padding: 10px; border-radius: 10px; background: #f1f1f1; font-size: 0.9rem;">Ciao! Come posso aiutarti oggi?</div>
            <div id="chat-options" style="display: flex; flex-direction: column; gap: 8px;"></div>
        </div>
    </div>
    <div id="chat-bubble" onclick="toggleChat()" style="width: 60px; height: 60px; background: #e67e22; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
        <img src="https://cdn-icons-png.flaticon.com/512/4712/4712035.png" alt="Chat" style="width: 35px;">
    </div>
</div>

<script>
    const msgBox = document.getElementById('chat-msg-box'); const options = document.getElementById('chat-options'); const chatWin = document.getElementById('chat-window');
    function toggleChat() { chatWin.style.display = chatWin.style.display === 'flex' ? 'none' : 'flex'; showLevel1(); }

    // LIVELLO 1: MENU PRINCIPALE
    function showLevel1() { msgBox.innerHTML = "Cosa desideri sapere?"; options.innerHTML = `<button class="chat-btn" onclick="showLevel2Camere()">🛌 Camere e Prezzi</button><button class="chat-btn" onclick="showLevel2Pagamenti()">💰 Pagamenti e Cash</button><button class="chat-btn" onclick="location.href='https://wa.me/393282124247'">💬 WhatsApp</button>`; }

    // LIVELLO 2: SOTTO-MENU CAMERE
    function showLevel2Camere() { msgBox.innerHTML = "Suite da €220/notte. Dettagli:"; options.innerHTML = `<button class="chat-btn" onclick="showLevel3Info()">📺 TV e Sky</button><button class="chat-btn" onclick="showLevel3Pet()">🐾 Animali</button><button class="chat-btn" onclick="showLevel1()">⬅️ Indietro</button>`; }
    
    // LIVELLO 2: SOTTO-MENU PAGAMENTI
    function showLevel2Pagamenti() { msgBox.innerHTML = "Come puoi pagare?"; options.innerHTML = `<button class="chat-btn" onclick="showLevel3Carte()">💳 Carte Accettate</button><button class="chat-btn" onclick="showLevel3Contanti()">💶 Pagare in contanti</button><button class="chat-btn" onclick="showLevel1()">⬅️ Indietro</button>`; }

    // LIVELLO 3: RISPOSTE FINALI
    function showLevel3Info() { msgBox.innerHTML = "Tutte le suite hanno TV Satellitare e Minibar. Al momento non offriamo l'abbonamento Sky, ma abbiamo Wi-Fi veloce per lo streaming."; options.innerHTML = `<button class="chat-btn" onclick="showLevel2Camere()">⬅️ Indietro</button>`; }
    function showLevel3Pet() { msgBox.innerHTML = "Accettiamo animali di piccola taglia su richiesta."; options.innerHTML = `<button class="chat-btn" onclick="showLevel2Camere()">⬅️ Indietro</button>`; }
    function showLevel3Carte() { msgBox.innerHTML = "Accettiamo Visa, MasterCard e le principali carte di debito/credito."; options.innerHTML = `<button class="chat-btn" onclick="showLevel2Pagamenti()">⬅️ Indietro</button>`; }
    function showLevel3Contanti() { msgBox.innerHTML = "Sì, è possibile pagare in contanti fino ai limiti previsti dalla legge italiana."; options.innerHTML = `<button class="chat-btn" onclick="showLevel2Pagamenti()">⬅️ Indietro</button>`; }
</script>
<style>.chat-btn { background: white; border: 1px solid #e67e22; color: #2c3e50; padding: 10px; border-radius: 8px; cursor: pointer; text-align: left; transition: 0.2s; font-size: 0.85rem;} .chat-btn:hover { background: #e67e22; color: white; }</style>    </body>
</html>
