<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Colazione - LagoBeat B&B</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html" style="text-decoration:none; color:white; font-weight:bold;">LAGOBEAT B&B</a>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="servizi.html">Servizi</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <section class="card">
            <h1>Il Risveglio Gourmet</h1>
            <p>Ogni mattina, un'esperienza sensoriale con vista sul Lago di Garda.</p>
            
            <img src="images/sala-colazioni.jpg" alt="Sala Colazioni" class="main-img" style="width:100%; height:450px; object-fit:cover; border-radius:15px; margin-top:20px;">

            <div style="text-align: left; margin-top: 30px; padding: 0 15px;">
                <h3>🥐 Il Nostro Buffet</h3>
                <p>Prodotti locali, dolci artigianali e una caffetteria espressa servita al tavolo.</p>
            </div>

            <div class="room-gallery">
                <div class="gallery-item">
                    <img src="images/colazione-dettaglio1.jpg" alt="Buffet">
                    <p>SAPORI AUTENTICI</p>
                </div>
                <div class="gallery-item">
                    <img src="images/colazione-dettaglio2.jpg" alt="Vista">
                    <p>VISTA DAL TAVOLO</p>
                </div>
            </div>

            <div style="margin-top:40px;">
                <a href="servizi.html" class="btn" style="background-color: #2c3e50; color: white; padding: 10px 30px;">Torna ai Servizi</a>
            </div>
        </section>
    </main>
</body>
</html>
