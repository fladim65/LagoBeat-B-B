<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benvenuti nel Nostro Resort</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="contatti.html">Contatti</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="camere" class="card-section">
            <h2>Le Nostre Camere</h2>
            <div class="card">
                <img src="camera-preview.jpg" alt="Camera Deluxe">
                <div class="card-content">
                    <h3>Camera Deluxe</h3>
                    <p>Comfort e relax immersi nella natura.</p>
                    <div class="button-group">
                        <a href="https://calendar.google.com/calendar/u/0/appointments/schedules/IL_TUO_LINK_GOOGLE_CALENDAR" target="_blank" class="btn btn-primary">Prenota su Calendar</a>
                        <a href="https://www.booking.com/hotel/it/tuo-link.html" target="_blank" class="btn btn-secondary">Vedi su Booking</a>
                    </div>
                </div>
            </div>
        </section>

        <section id="attivita" class="card-section">
            <h2>Attività</h2>
            <div class="card">
                <p>Esplora le nostre attività guidate e i tour locali.</p>
                <a href="mailto:tuaemail@esempio.it?subject=Richiesta Informazioni Attività" class="btn btn-outline">Scrivici una Mail</a>
            </div>
        </section>
    </main>
