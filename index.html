<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LagoBeat B&B - Home</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <img src="images/lago.jpg" alt="Logo" class="nav-logo">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="camere.html">Camere</a></li>
                <li><a href="contatti.html">Contatti</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero" style="background: linear-gradient(rgba(0,0,0,0.4),rgba(0,0,0,0.4)), url('images/lago-garda.jpg') center/cover;">

            <h1>LagoBeat B&B</h1>

    <main class="container">

            <div class="gallery-grid">

                </div>
                <div class="gallery-item">
                    <img src="images/surf.jpg" alt="Surf">

                </div>
