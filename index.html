<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LagoBeat B&B - Prenotazioni</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo-container">
                <img src="img/logo.png" alt="LagoBeat Logo" class="nav-logo">
            </div>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="contatti.html">Contatti</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero">
            <div class="hero-content">
                <h1>Benvenuti al LagoBeat B&B</h1>
                <p>Il tuo relax a portata di click.</p>
            </div>
        </section>

        <section id="prenota" class="container">
            <div class="card">
                <h2>Prenota Camere e Attività</h2>
                <p>Seleziona le date sul calendario o contattaci direttamente via email.</p>
                
                <div class="button-grid">
                    <a href="https://calendar.google.com/calendar/u/0/appointments/schedules/IL_TUO_LINK" target="_blank" class="btn btn-calendar">
                        📅 Prenota su Calendar
                    </a>
                    
                    <a href="https://www.booking.com/hotel/it/lagobeat.it.html" target="_blank" class="btn btn-booking">
                        🏨 Prenota su Booking
                    </a>

                    <a href="mailto:info@lagobeat.it?subject=Richiesta Informazioni" class="btn btn-email">
                        ✉️ Inviaci una Mail
                    </a>
                </div>
            </div>
        </section>

        <section class="gallery container">
            <div class="image-box">
                <img src="img/camera1.jpg" alt="Camera 1">
            </div>
            <div class="image-box">
                <img src="img/camera2.jpg" alt="Camera 2">
            </div>
        </section>
    </main>
</body>
</html>
