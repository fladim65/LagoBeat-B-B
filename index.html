<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LagoBeat B&B - Home</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <img src="images/lago.jpg" alt="Logo" class="nav-logo">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="camere.html">Camere</a></li>
                <li><a href="contatti.html">Contatti</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero" style="background: linear-gradient(rgba(0,0,0,0.3),rgba(0,0,0,0.3)), url('images/esterno-hotel.jpg') center/cover;">
        <div class="hero-overlay">
            <h1>Benvenuti al LagoBeat B&B</h1>
            <p>La tua casa a Desenzano del Garda</p>
            <a href="camere.html" class="btn btn-calendar">Prenota ora</a>
        </div>
    </section>

    <main class="container">
        <section class="card" style="margin-bottom: 30px;">
            <h2>Inizia la giornata con gusto</h2>
            <p>Ogni mattina ti aspetta una ricca colazione nella nostra sala dedicata.</p>
            <img src="images/sala-colazione.jpg" alt="Sala Colazione LagoBeat" style="width:100%; border-radius:15px; margin-top:15px;">
        </section>

        <section class="card">
            <h2>Esplora il Garda</h2>
            <img src="images/lago-garda.jpg" alt="Panoramica Lago" style="width:100%; border-radius:15px; margin-bottom:20px;">
            
            <div class="gallery-grid">
                <div class="gallery-item"><img src="images/mountainbike.jpg" alt="Bike"><p>Mountain Bike</p></div>
                <div class="gallery-item"><img src="images/surf.jpg" alt="Surf"><p>Windsurf</p></div>
                <div class="gallery-item"><img src="images/kayak.jpg" alt="Kayak"><p>Kayak</p></div>
            </div>
        </section>
    </main>
</body>
</html>
